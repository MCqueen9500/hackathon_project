version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: egc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: egc_user
      POSTGRES_PASSWORD: egc_pass
      POSTGRES_DB: egc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egc_user -d egc_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
